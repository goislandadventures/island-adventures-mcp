<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Island Adventures Charter</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: #ffffff;
      --card: #ffffff;
      --soft: #f7f8fa;
      --text: #111827;
      --muted: #667085;
      --line: #e5e7eb;

      --brand-green: #93c900;
      --brand-orange: #f15a24;
      --brand-blue: #334b9b;

      --button: #111827;
      --button-text: #ffffff;

      --radius: 18px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --card: #202020;
        --soft: #292929;
        --text: #f7f7f7;
        --muted: #b6b6b6;
        --line: #3a3a3a;
        --button: #f5f5f5;
        --button-text: #111111;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 2px;
    }

    .card {
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .brand-bar {
      height: 5px;
      background:
        linear-gradient(
          90deg,
          var(--brand-blue) 0 28%,
          var(--brand-green) 28% 68%,
          var(--brand-orange) 68% 100%
        );
    }

    .content {
      padding: 22px 22px 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    .best-fit {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 13px;
      padding: 7px 10px;
      background: var(--soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--brand-green);
    }

    .description {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .why {
      margin-top: 18px;
      padding: 14px 15px;
      background: var(--soft);
      border-radius: 13px;
    }

    .section-label {
      margin: 0 0 6px;
      color: var(--text);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .why p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .price-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
    }

    .price-heading h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    .starting-price {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .starting-price strong {
      color: var(--text);
      font-size: 16px;
    }

    .options {
      display: grid;
      gap: 9px;
      margin-top: 11px;
    }

    .option {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 16px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
    }

    .option.popular {
      border-color: var(--brand-green);
    }

    .popular-badge {
      position: absolute;
      top: -8px;
      right: 12px;
      padding: 3px 7px;
      background: var(--brand-green);
      color: #111827;
      border-radius: 999px;
      font-size: 9px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .option-duration {
      font-size: 14px;
      font-weight: 800;
    }

    .option-price {
      font-size: 15px;
      font-weight: 850;
      text-align: right;
    }

    .option-label {
      grid-column: 1 / -1;
      margin-top: -3px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.35;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 19px;
    }

    .highlight {
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 10px 11px;
      background: var(--soft);
      border-radius: 11px;
      font-size: 12px;
      line-height: 1.3;
      font-weight: 700;
    }

    .location {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 13px;
    }

    .location-label {
      color: var(--muted);
    }

    .location-value {
      text-align: right;
      font-weight: 700;
    }

    .footer {
      padding: 16px 18px 17px;
      background: var(--soft);
      border-top: 1px solid var(--line);
    }

    .button {
      width: 100%;
      min-height: 50px;
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-size: 15px;
      font-weight: 850;
      cursor: pointer;
      transition:
        transform 120ms ease,
        opacity 120ms ease;
    }

    .button:hover {
      opacity: 0.92;
    }

    .button:active {
      transform: scale(0.992);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .booking-note {
      margin: 9px 5px 0;
      color: var(--muted);
      text-align: center;
      font-size: 11.5px;
      line-height: 1.4;
    }

    .loading {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 520px) {
      .content {
        padding: 19px 17px 16px;
      }

      h1 {
        font-size: 23px;
      }

      .highlights {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="card" id="app">
      <div class="loading">
        Finding the easiest way to get you on the water…
      </div>
    </div>
  </div>

  <script>
    const app = document.getElementById("app");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function money(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "";
      }

      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0
      }).format(number);
    }

    function renderOptions(trip) {
      if (!Array.isArray(trip.options) || trip.options.length === 0) {
        return "";
      }

      return `
        <div class="price-heading">
          <h2>Choose what fits your day</h2>

          ${
            trip.startingPrice
              ? `
                <div class="starting-price">
                  From <strong>${money(trip.startingPrice)}</strong>
                </div>
              `
              : ""
          }
        </div>

        <div class="options">
          ${trip.options
            .map(
              (option) => `
                <div class="option ${option.popular ? "popular" : ""}">
                  ${
                    option.popular
                      ? `<div class="popular-badge">Popular choice</div>`
                      : ""
                  }

                  <div class="option-duration">
                    ${escapeHtml(option.duration)}
                  </div>

                  <div class="option-price">
                    ${money(option.price)}
                  </div>

                  <div class="option-label">
                    ${escapeHtml(option.label)}
                  </div>
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderHighlights(trip) {
      if (!Array.isArray(trip.highlights) || trip.highlights.length === 0) {
        return "";
      }

      return `
        <div class="highlights">
          ${trip.highlights
            .map(
              (item) => `
                <div class="highlight">
                  ${escapeHtml(item)}
                </div>
              `
            )
            .join("")}
        </div>
      `;
    }

    function renderTrip(data) {
      const trip = data?.trip;

      if (!trip) {
        return;
      }

      app.innerHTML = `
        <div class="brand-bar"></div>

        <div class="content">
          <div class="eyebrow">
            Island Adventures · Islamorada
          </div>

          <h1>${escapeHtml(trip.name)}</h1>

          <div class="best-fit">
            <span class="dot"></span>
            Best match for your request
          </div>

          <p class="description">
            ${escapeHtml(trip.description)}
          </p>

          <div class="why">
            <div class="section-label">Why this fits</div>

            <p>
              ${escapeHtml(trip.recommendation)}
            </p>
          </div>

          ${renderOptions(trip)}

          ${renderHighlights(trip)}

          <div class="location">
            <span class="location-label">
              Departure
            </span>

            <span class="location-value">
              ${escapeHtml(trip.location)}
            </span>
          </div>
        </div>

        <div class="footer">
          <button
            class="button"
            id="availabilityButton"
            type="button"
          >
            Check Private Charter Availability
          </button>

          <div class="booking-note">
            See available dates and times on Island Adventures’ secure WaveRez reservation page. No commitment required to check availability.
          </div>
        </div>
      `;

      const button =
        document.getElementById("availabilityButton");

      button.addEventListener(
        "click",
        async () => {
          const url = trip.bookingUrl;

          if (!url) {
            return;
          }

          button.disabled = true;
          button.textContent =
            "Opening availability…";

          try {
            if (
              window.openai &&
              typeof window.openai.openExternal === "function"
            ) {
              await window.openai.openExternal({
                href: url,
                redirectUrl: false
              });
            } else {
              window.open(
                url,
                "_blank",
                "noopener,noreferrer"
              );
            }
          } catch (error) {
            console.error(
              "Unable to open availability:",
              error
            );

            window.open(
              url,
              "_blank",
              "noopener,noreferrer"
            );
          } finally {
            button.disabled = false;
            button.textContent =
              "Check Private Charter Availability";
          }
        }
      );

      notifyHeight();
    }

    function notifyHeight() {
      try {
        if (
          window.openai &&
          typeof window.openai.notifyIntrinsicHeight === "function"
        ) {
          window.openai.notifyIntrinsicHeight(
            document.documentElement.scrollHeight
          );
        }
      } catch (_) {}
    }

    /*
     * Initial result if ChatGPT already populated
     * the widget before this script runs.
     */
    try {
      const initial =
        window.openai?.toolOutput;

      if (initial?.trip) {
        renderTrip(initial);
      }
    } catch (_) {}

    /*
     * ChatGPT can populate or replace toolOutput
     * after the iframe has already loaded.
     */
    window.addEventListener(
      "openai:set_globals",
      (event) => {
        try {
          const output =
            event.detail?.globals?.toolOutput ??
            window.openai?.toolOutput;

          if (output?.trip) {
            renderTrip(output);
          }
        } catch (_) {}
      },
      { passive: true }
    );

    /*
     * Standard MCP Apps tool-result notification.
     */
    window.addEventListener(
      "message",
      (event) => {
        if (event.source !== window.parent) {
          return;
        }

        const message = event.data;

        if (
          !message ||
          message.jsonrpc !== "2.0"
        ) {
          return;
        }

        if (
          message.method ===
          "ui/notifications/tool-result"
        ) {
          const output =
            message.params?.structuredContent;

          if (output?.trip) {
            renderTrip(output);
          }
        }
      },
      { passive: true }
    );

    window.addEventListener(
      "load",
      notifyHeight,
      { once: true }
    );
  </script>
</body>
</html>
